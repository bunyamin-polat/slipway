name: Terraform plan

# Posts the plan for dev as a comment on the pull request, so a change to infrastructure
# is reviewed as a diff of resources rather than a diff of HCL. One screenshot of this
# communicates more about how a team works than a paragraph claiming they do it.

on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/**"
      - "docker/**"
      - "template/**"
      - ".github/workflows/plan.yml"

permissions:
  id-token: write # required to request the OIDC token
  contents: read
  pull-requests: write # required to post the comment

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: slipway-plan-${{ github.run_id }}

      - name: Write the backend config, which is deliberately not in git
        # backend.hcl names the state bucket, and that contains the account ID. Everything
        # else the deploy needs is in slipway.yaml, which is committed because it holds
        # nothing secret.
        run: |
          cat > terraform/stacks/20_app/backend.hcl <<EOF
          bucket       = "${{ secrets.TF_STATE_BUCKET }}"
          key          = "20_app/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - run: uv sync --locked

      - name: Plan
        # Same code path as a deploy, minus the build and the apply — so what is reviewed
        # here is what would actually run.
        run: |
          uv run python scripts/deploy.py "$ENVIRONMENT" --plan \
            --tag "${GITHUB_SHA::7}" > terraform/stacks/20_app/plan.txt 2>&1

      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/stacks/20_app/plan.txt', 'utf8');

            // GitHub rejects comments over 65536 characters. Keep the tail: the summary
            // line at the bottom is the part anyone actually reads first.
            const limit = 60000;
            if (plan.length > limit) {
              plan = '...truncated...\n' + plan.slice(-limit);
            }

            const body = [
              '### Terraform plan — `dev`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            // Update the existing comment instead of adding one per push, so a long
            // pull request does not become a wall of stale plans.
            const marker = '### Terraform plan — `dev`';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(
              c => c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
