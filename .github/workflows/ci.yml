name: CI

# Runs on every pull request and every push to main. Touches no AWS account and needs no
# credentials: lint, tests, and a build that proves the image still builds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        # Includes terraform fmt and validate, which run against a temporary copy of
        # terraform/ rather than the real stacks.
        run: uv run pytest

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Lint every module and stack
        run: |
          tflint --init
          tflint --recursive --chdir=terraform --minimum-failure-severity=error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        # Not pushed — this job only proves it still builds. The flags match deploy.py
        # exactly, because an image that builds here and fails there teaches nothing.
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f docker/Dockerfile.fastapi \
            -t slipway-app:ci \
            --load \
            template/
